name: Build SafariWipe V6.5

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Packaging Files
        shell: python
        run: |
          import os
          os.makedirs("pkg/DEBIAN", exist_ok=True)
          os.makedirs("pkg/Library/MobileSubstrate/DynamicLibraries", exist_ok=True)

          plist = """<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>Filter</key>
            <dict>
              <key>Bundles</key>
              <array>
                <string>com.apple.mobilesafari</string>
              </array>
            </dict>
          </dict>
          </plist>"""
          with open("pkg/Library/MobileSubstrate/DynamicLibraries/SafariWipe.plist", "w", encoding="utf-8") as f:
              f.write(plist.strip() + "\n")

          control = """Package: com.custom.safariwipe
          Name: SafariWipe V6.5 Tab & Canvas Fix
          Version: 6.5.0
          Architecture: iphoneos-arm
          Description: Safari Data Management Utility
          Maintainer: Custom
          Author: Custom
          Section: Tweaks
          Depends: mobilesubstrate
          """
          with open("pkg/DEBIAN/control", "w", encoding="utf-8") as f:
              f.write(control.strip() + "\n")

      - name: Compile and Package DEB
        run: |
          brew install ldid dpkg
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun -sdk iphoneos clang -arch arm64 -arch arm64e -dynamiclib -fobjc-arc -isysroot "$SDK_PATH" -miphoneos-version-min=14.0 -Wno-deprecated-declarations -install_name @rpath/SafariWipe.dylib -framework Foundation -framework UIKit -framework WebKit -framework Security -framework QuartzCore -framework CoreGraphics -framework CoreTelephony SafariWipe.m -o SafariWipe.dylib
          ldid -S SafariWipe.dylib
          cp SafariWipe.dylib pkg/Library/MobileSubstrate/DynamicLibraries/
          chmod 0755 pkg/Library/MobileSubstrate/DynamicLibraries/SafariWipe.dylib
          chmod 0644 pkg/Library/MobileSubstrate/DynamicLibraries/SafariWipe.plist
          dpkg-deb -Zgzip -b pkg SafariWipe.deb

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafariWipe-V6.5-Package
          path: |
            SafariWipe.deb
            SafariWipe.dylib
